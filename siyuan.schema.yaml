# Rime schema settings
# encoding: utf-8

schema:
    schema_id: siyuan
    name: 原碼
    version: "0.0"
    author:
        - 陳林 <1chen0bryan@gmail.com>
    dependencies:
        - luna_pinyin
        - pinyin_simp

switches:
    - name: ascii_mode
      reset: 0
      states: [ 中文, 西文 ]
    - name: full_shape
      states: [ 半角, 全角 ]
    - options: [ no_change, zh_trad, zh_simp ]
      states: [ 无轉換, 傳統漢字, 简化汉字 ]
      reset: 0
    - name: ascii_punct
      states: [ 。，, ．， ]

engine:
    processors:
        - lua_processor@*common.commit_n_return
        - lua_processor@*xinzheng*proc
        - selector
        - ascii_composer
        - recognizer
        - key_binder
        - speller
        - punctuator
        - navigator
        - express_editor
    segmentors:
        - ascii_segmentor
        - matcher
        - affix_segmentor@no_max_code
        - abc_segmentor
        - punct_segmentor
        - fallback_segmentor
    translators:
        - punct_translator
        - table_translator
        - table_translator@no_max_code
        - reverse_lookup_translator
    filters:
        - simplifier@traditional
        - simplifier
        - uniquifier
        - lua_filter@*xinzheng*filter

speller:
    alphabet: zyxwvutsrqpomlkjihgfedca;,./=
    initials: zyxwvutsrqpomlkjihgfedca;,./
    max_code_length: 4
    auto_select: true
    auto_select_pattern: ".{1,3}="
    #auto_select_unique_candidate: true
    algebra:
      - xform/^([a-z])=$/$1/
      - xform/^(....).+(....)$/$1$2/
      - xform/^(..)(.).(.).$/$1$2$3=/
      - xform/^(.).(.).(.).(.).$/$1$2$3$4=/

translator:
    dictionary: siyuan-ft # 繁體
    #dictionary: siyuan-jt # 简体
    enable_user_dict: false

no_max_code:
  tag: no_max_code
  dictionary: siyuan-ft
  prefix: "b"
  tips: 〔不限長〕

reverse_lookup:
    dictionary: luna_pinyin
    prefix: "`"
    tips: 〔拼音〕

simplifier:
    tips: all
    option_name: zh_simp

traditional:
    opencc_config: s2t.json
    option_name: zh_trad

punctuator:
    import_preset: default

key_binder:
    import_preset: default
    bindings:
      - { when: has_menu, accept: period, send: period }
      - { when: has_menu, accept: comma, send: comma }
      - { when: composing, accept: b, send: equal }
      - { when: composing, accept: n, send: equal }

editor:
  bindings:
    Escape: commit_script_text

recognizer:
    patterns:
        reverse_lookup: "`[a-z]*'?$|[a-z]+'$"
        no_max_code: "^b.*$"

xinzheng:
  special_symbol: "="
  special_keys: ["b", "n"]
